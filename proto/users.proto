syntax = "proto3";

package groupsapp.users;

service UsersService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest) returns (UserReply);
  rpc GetUsersBatch(GetUsersBatchRequest) returns (GetUsersBatchResponse);
  rpc FindByUsername(FindByUsernameRequest) returns (UserReply);
}

message FindByUsernameRequest { string username = 1; }

message ValidateTokenRequest { string token = 1; }
message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
}

message GetUserRequest { string user_id = 1; }

message UserReply {
  string id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
}

message GetUsersBatchRequest { repeated string user_ids = 1; }
message GetUsersBatchResponse { repeated UserReply users = 1; }
