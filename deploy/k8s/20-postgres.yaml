# =============================================================================
# GROUPSAPP — PostgreSQL via Amazon RDS (EXTERNAL)
# =============================================================================
# This file does NOT deploy PostgreSQL as a Pod.
# Instead it creates a Kubernetes ExternalName Service that points to your
# Amazon RDS endpoint, so all services can connect with the same hostname
# "postgres" they already use in their DATABASE_URL env vars.
#
# SETUP STEPS:
#   1. Create an Amazon RDS PostgreSQL 16 Multi-AZ instance in the same VPC
#      as your EKS cluster.
#   2. Create four databases on it: users_auth, groups, messages, presence
#      (run the SQL from deploy/postgres/init-multiple-dbs.sh against RDS).
#   3. Replace REPLACE_WITH_RDS_ENDPOINT below with the actual RDS endpoint,
#      e.g.: groupsapp.abcdef123.us-east-1.rds.amazonaws.com
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: groupsapp
spec:
  type: ExternalName
  externalName: REPLACE_WITH_RDS_ENDPOINT
  ports:
    - port: 5432
      targetPort: 5432
