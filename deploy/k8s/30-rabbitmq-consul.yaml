apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq, namespace: groupsapp}
spec:
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports: [{containerPort: 5672}, {containerPort: 15672}]
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: groupsapp}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: ui, port: 15672, targetPort: 15672}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: consul, namespace: groupsapp}
spec:
  replicas: 1
  selector: {matchLabels: {app: consul}}
  template:
    metadata: {labels: {app: consul}}
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.19
          args: ["agent","-server","-bootstrap","-ui","-client=0.0.0.0"]
          ports: [{containerPort: 8500}]
---
apiVersion: v1
kind: Service
metadata: {name: consul, namespace: groupsapp}
spec:
  selector: {app: consul}
  ports: [{port: 8500, targetPort: 8500}]
