# =============================================================================
# GROUPSAPP — Microservice Deployments, Services & HPAs
# =============================================================================
# BEFORE APPLYING:
#   1. Build and push all images to Amazon ECR:
#      docker build -t <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/groupsapp-users-auth:latest \
#           -f services/users-auth-service/Dockerfile .
#      (repeat for groups, messages-files, presence-notifications)
#
#   2. Replace every "REGISTRY" placeholder with your ECR base URL:
#      <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com
#
#   3. Authenticate Docker to ECR:
#      aws ecr get-login-password --region <REGION> | \
#        docker login --username AWS --password-stdin <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com
# =============================================================================

# ---- Users / Auth Service ----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-auth-service
  namespace: groupsapp
  labels: {app: users-auth-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: users-auth-service}}
  template:
    metadata:
      labels: {app: users-auth-service}
    spec:
      serviceAccountName: groupsapp-sa
      containers:
        - name: app
          image: REGISTRY/groupsapp-users-auth:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8000, name: http}, {containerPort: 50051, name: grpc}]
          envFrom:
            - configMapRef:  {name: groupsapp-config}
            - secretRef:     {name: groupsapp-secret}
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://groupsapp:$(POSTGRES_PASSWORD)@postgres:5432/users_auth"
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe:  {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: users-auth-service
  namespace: groupsapp
spec:
  selector: {app: users-auth-service}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
    - {name: grpc, port: 50051, targetPort: 50051}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: users-auth-service
  namespace: groupsapp
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: users-auth-service}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}

