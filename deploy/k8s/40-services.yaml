# ---- Messages / Files Service ----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messages-files-service
  namespace: groupsapp
  labels: {app: messages-files-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: messages-files-service}}
  template:
    metadata:
      labels: {app: messages-files-service}
    spec:
      serviceAccountName: groupsapp-sa   # Needs S3 write permission via IRSA
      containers:
        - name: app
          image: REGISTRY/groupsapp-messages:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef:  {name: groupsapp-config}
            - secretRef:     {name: groupsapp-secret}
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://groupsapp:$(POSTGRES_PASSWORD)@postgres:5432/messages"
            - name: S3_BUCKET
              valueFrom: {secretKeyRef: {name: groupsapp-secret, key: S3_BUCKET}}
            - name: S3_REGION
              valueFrom: {secretKeyRef: {name: groupsapp-secret, key: S3_REGION}}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe:  {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: messages-files-service
  namespace: groupsapp
spec:
  selector: {app: messages-files-service}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: messages-files-service
  namespace: groupsapp
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: messages-files-service}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}

