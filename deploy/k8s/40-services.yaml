# =============================================================================
# GROUPSAPP — Microservices + Frontend: Deployments, Services, HPAs
# =============================================================================
# ANTES DE APLICAR:
#   1. Sube las imágenes a un registry accesible (ECR o Docker Hub público).
#   2. Reemplaza REGISTRY por tu URL base de ECR o Docker Hub.
#      Ejemplo ECR: 123456789012.dkr.ecr.us-east-1.amazonaws.com
#      Ejemplo Hub: docker.io/tuusuario
#   3. Reemplaza REPLACE_WITH_EFS_FILE_SYSTEM_ID con el ID de tu EFS.
# =============================================================================

# ========== EFS Storage para archivos compartidos ==========
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: groupsapp-uploads-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: REPLACE_WITH_EFS_FILE_SYSTEM_ID
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: groupsapp
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 20Gi

# ========== Users / Auth Service ==========
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-auth-service
  namespace: groupsapp
spec:
  replicas: 2
  selector: {matchLabels: {app: users-auth-service}}
  template:
    metadata: {labels: {app: users-auth-service}}
    spec:
      containers:
        - name: app
          image: REGISTRY/groupsapp-users-auth:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8000, name: http}, {containerPort: 50051, name: grpc}]
          envFrom:
            - configMapRef:  {name: groupsapp-config}
            - secretRef:     {name: groupsapp-secret}
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://groupsapp:$(POSTGRES_PASSWORD)@postgres:5432/users_auth"
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe:  {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: users-auth-service, namespace: groupsapp}
spec:
  selector: {app: users-auth-service}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
    - {name: grpc, port: 50051, targetPort: 50051}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: users-auth-service, namespace: groupsapp}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: users-auth-service}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]

