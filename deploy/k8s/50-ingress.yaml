apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: groupsapp
  namespace: groupsapp
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend: {service: {name: users-auth-service, port: {number: 8000}}}
          - path: /api/v1/users
            pathType: Prefix
            backend: {service: {name: users-auth-service, port: {number: 8000}}}
          - path: /api/v1/groups
            pathType: Prefix
            backend: {service: {name: groups-service, port: {number: 8000}}}
          - path: /api/v1/messages
            pathType: Prefix
            backend: {service: {name: messages-files-service, port: {number: 8000}}}
          - path: /uploads
            pathType: Prefix
            backend: {service: {name: messages-files-service, port: {number: 8000}}}
          - path: /api/v1/presence
            pathType: Prefix
            backend: {service: {name: presence-notifications-service, port: {number: 8000}}}
          - path: /ws
            pathType: Prefix
            backend: {service: {name: presence-notifications-service, port: {number: 8000}}}
