# =============================================================================
# GROUPSAPP — Secrets & ConfigMap para EKS en AWS Academy
# =============================================================================
# INSTRUCCIONES:
#   1. Reemplaza REPLACE_WITH_RDS_ENDPOINT con el endpoint real de tu RDS.
#   2. Reemplaza REPLACE_WITH_RDS_PASSWORD con la contraseña de tu RDS.
#   3. Reemplaza REPLACE_WITH_EFS_FILE_SYSTEM_ID en 40-services.yaml
#   4. Cambia SECRET_KEY por un string aleatorio de 32+ caracteres.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: groupsapp-config
  namespace: groupsapp
data:
  # --- Service Discovery ---
  CONSUL_URL: "http://consul:8500"

  # --- Token Config ---
  ACCESS_TOKEN_EXPIRE_MINUTES: "120"

  # --- Inter-service gRPC addresses ---
  USERS_GRPC_ADDR: "users-auth-service:50051"
  GROUPS_GRPC_ADDR: "groups-service:50052"

  # --- File Storage (local, EFS mounted) ---
  STORAGE_BACKEND: "local"
  UPLOAD_DIR: "/data/uploads"
  PUBLIC_URL_BASE: "/uploads"

---
apiVersion: v1
kind: Secret
metadata:
  name: groupsapp-secret
  namespace: groupsapp
type: Opaque
stringData:
  # ⚠️ CAMBIA ESTOS VALORES ANTES DE DESPLEGAR ⚠️
  SECRET_KEY: "groupsapp-super-secret-change-me-32chars"
  POSTGRES_PASSWORD: "REPLACE_WITH_RDS_PASSWORD"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
