# =============================================================================
# GROUPSAPP — Kubernetes Secrets & ConfigMap
# =============================================================================
# BEFORE APPLYING:
#   1. Edit SECRET_KEY to a secure random string (32+ chars).
#   2. Edit POSTGRES_PASSWORD to the password of your Amazon RDS instance.
#   3. Set the AMQP_URL to your Amazon MQ endpoint.
#   4. Set S3_BUCKET and S3_REGION for file storage.
#
# Apply with:
#   kubectl apply -f deploy/k8s/10-secrets-config.yaml
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: groupsapp-config
  namespace: groupsapp
data:
  # --- Service Discovery ---
  CONSUL_URL: "http://consul:8500"

  # --- Token Config ---
  ACCESS_TOKEN_EXPIRE_MINUTES: "120"

  # --- Inter-service gRPC addresses ---
  USERS_GRPC_ADDR: "users-auth-service:50051"
  GROUPS_GRPC_ADDR: "groups-service:50052"

  # --- File Storage (S3) ---
  # Set STORAGE_BACKEND to "s3" and fill S3_BUCKET/S3_REGION below.
  # For local testing you can use "local" and keep the EFS PVC.
  STORAGE_BACKEND: "s3"
  UPLOAD_DIR: "/data/uploads"
  PUBLIC_URL_BASE: "/uploads"

---
apiVersion: v1
kind: Secret
metadata:
  name: groupsapp-secret
  namespace: groupsapp
type: Opaque
stringData:
  # ⚠️  CHANGE ALL OF THESE BEFORE DEPLOYING ⚠️
  SECRET_KEY: "REPLACE_WITH_SECURE_RANDOM_32_CHAR_STRING"
  POSTGRES_PASSWORD: "REPLACE_WITH_RDS_PASSWORD"

  # Amazon MQ (RabbitMQ) endpoint — get this from the AWS console
  # Format: amqps://USER:PASS@BROKER-ID.mq.REGION.amazonaws.com:5671/
  AMQP_URL: "amqp://guest:guest@rabbitmq:5672/"

  # Amazon S3 — for file uploads
  S3_BUCKET: "REPLACE_WITH_YOUR_S3_BUCKET_NAME"
  S3_REGION: "us-east-1"

  # RabbitMQ default credentials (only used if deploying RabbitMQ in-cluster)
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"

---
# ServiceAccount with IAM role annotation for S3 and CloudWatch access.
# Replace ACCOUNT_ID and CLUSTER_NAME before applying.
# See: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
apiVersion: v1
kind: ServiceAccount
metadata:
  name: groupsapp-sa
  namespace: groupsapp
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_ACCOUNT_ID:role/groupsapp-eks-role"
