# =============================================================================
# GROUPSAPP — PostgreSQL via Amazon RDS (Servicio externo)
# =============================================================================
# En lugar de correr Postgres como Pod dentro de Kubernetes, usamos
# Amazon RDS Multi-AZ que ofrece:
#   - Replicación automática
#   - Backups automáticos
#   - Failover automático (Alta Disponibilidad)
#
# Este Service tipo ExternalName permite que los microservicios
# sigan usando "postgres" como hostname en su DATABASE_URL.
#
# PASOS:
#   1. Crea una instancia RDS PostgreSQL 16 desde la consola AWS.
#   2. Crea las 4 bases de datos: users_auth, groups, messages, presence.
#   3. Reemplaza REPLACE_WITH_RDS_ENDPOINT con el endpoint real.
#      Ejemplo: groupsapp-db.cxyz12345.us-east-1.rds.amazonaws.com
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: groupsapp
spec:
  type: ExternalName
  externalName: REPLACE_WITH_RDS_ENDPOINT
  ports:
    - port: 5432
      targetPort: 5432
