# =============================================================================
# GROUPSAPP — Microservices + Frontend: Deployments, Services, HPAs
# =============================================================================
# Arquitectura (según diagrama):
#   Client (SPA) → API Gateway (ALB) → 4 microservicios
#   - users-auth    : JWT, register, login, profiles        | gRPC :50051
#   - groups         : rooms, DMs, roles, members            | gRPC :50052
#   - messages-files : WebSocket, receipts, file upload (S3) |
#   - presence       : online/offline, last seen, heartbeat  |
#
#   Comunicación inter-servicio: gRPC (azul punteado)
#   Eventos async: RabbitMQ (message.created, presence.changed)
#   Service registry: Consul (health-check)
#   BD: PostgreSQL (una por servicio, en Amazon RDS Multi-AZ)
#   Archivos: Amazon S3
#
# ANTES DE APLICAR:
#   1. Reemplaza REGISTRY con tu URL de ECR o Docker Hub.
# =============================================================================

# ========== Users / Auth Service ==========
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-auth-service
  namespace: groupsapp
spec:
  replicas: 2
  selector: {matchLabels: {app: users-auth-service}}
  template:
    metadata: {labels: {app: users-auth-service}}
    spec:
      containers:
        - name: app
          image: REGISTRY/groupsapp-users-auth:latest
          imagePullPolicy: Always
          ports:
            - {containerPort: 8000, name: http}
            - {containerPort: 50051, name: grpc}
          envFrom:
            - configMapRef:  {name: groupsapp-config}
            - secretRef:     {name: groupsapp-secret}
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://groupsapp:$(POSTGRES_PASSWORD)@postgres:5432/users_auth"
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe:  {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: users-auth-service, namespace: groupsapp}
spec:
  selector: {app: users-auth-service}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
    - {name: grpc, port: 50051, targetPort: 50051}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: users-auth-service, namespace: groupsapp}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: users-auth-service}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]

