# ========== Frontend (Nginx static SPA) ==========
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: groupsapp
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: nginx
          image: REGISTRY/groupsapp-frontend:latest
          imagePullPolicy: Always
          ports: [{containerPort: 80, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: 80}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            requests: {cpu: 50m,  memory: 64Mi}
            limits:   {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: groupsapp}
spec:
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: frontend, namespace: groupsapp}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: frontend}
  minReplicas: 2
  maxReplicas: 4
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}}]
