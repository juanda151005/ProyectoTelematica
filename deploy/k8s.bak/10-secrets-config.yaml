# =============================================================================
# GROUPSAPP — Secrets & ConfigMap para EKS (AWS Academy)
# =============================================================================
# Antes de aplicar, reemplaza todos los valores REPLACE_*
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: groupsapp-config
  namespace: groupsapp
data:
  # --- Service Discovery (Consul HA) ---
  CONSUL_URL: "http://consul:8500"

  # --- Token Config ---
  ACCESS_TOKEN_EXPIRE_MINUTES: "120"

  # --- Inter-service gRPC ---
  USERS_GRPC_ADDR: "users-auth-service:50051"
  GROUPS_GRPC_ADDR: "groups-service:50052"

  # --- File Storage: S3 (como indica el diagrama de arquitectura) ---
  STORAGE_BACKEND: "s3"
  UPLOAD_DIR: "/data/uploads"
  PUBLIC_URL_BASE: "/uploads"

---
apiVersion: v1
kind: Secret
metadata:
  name: groupsapp-secret
  namespace: groupsapp
type: Opaque
stringData:
  # ⚠️  REEMPLAZA ESTOS VALORES ANTES DE DESPLEGAR ⚠️
  SECRET_KEY: "groupsapp-super-secret-change-me-32chars"
  POSTGRES_PASSWORD: "REPLACE_WITH_RDS_PASSWORD"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"

  # Amazon S3 — para subida de archivos (messages-files-service)
  S3_BUCKET: "REPLACE_WITH_S3_BUCKET_NAME"
  S3_REGION: "us-east-1"
