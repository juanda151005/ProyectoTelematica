server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA — any unknown path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with cache headers
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Health-check endpoint for ALB / Kubernetes readiness probe
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;
}
